manifestVersion: 1
id: ezes-github-downloads
category: developer
name: GitHub Downloads
version: "1.2.1"
tagline: Combien de fois vos releases GitHub ont-elles été téléchargées ?
icon: https://raw.githubusercontent.com/jihemezes/ezes-umbrel-store/main/ezes-github-downloads/icon.svg
description: >-
  Relève automatiquement le nombre de téléchargements de chaque asset de chaque
  release de tous les dépôts d'un compte ou d'une organisation GitHub, garde
  l'historique et l'affiche dans un tableau de bord : total, classement des
  assets, répartition par dépôt, évolution dans le temps et progression depuis
  le dernier relevé. Un onglet Analyses (rythme, pics, plateformes, adoption des
  versions, assets dormants) et un onglet Trafic (vues, clones, sites d'origine)
  complètent le tableau de bord.


  Au premier lancement, indiquez simplement le compte GitHub à analyser. Un
  token est facultatif (il permet d'inclure vos dépôts privés et d'éviter la
  limite de 60 requêtes par heure) ; il est nécessaire pour le trafic, avec
  l'accès en écriture aux dépôts.
developer: Jean-Michel EZES
website: https://jmezes.fr
dependencies: []
repo: https://github.com/jihemezes/ezes-umbrel-store
support: https://github.com/jihemezes/ezes-umbrel-store/issues
port: 8093
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  L'icône de l'application s'affiche maintenant dans l'onglet du navigateur.

  Nouvel onglet Analyses : rythme sur 7 jours et tendance, pics inhabituels,
  plus fortes progressions, répartition par système et architecture, part de
  chaque version, adoption des releases (7 et 30 premiers jours), assets
  dormants, étoiles, forks et abonnés des dépôts.

  Nouvel onglet Trafic (avec un token ayant l'accès en écriture aux dépôts) :
  vues et clones par jour, sites d'origine et pages les plus vues, avec un
  historique conservé au-delà des 14 jours fournis par GitHub.

  Le relevé du trafic est facultatif (Réglages) et ne peut pas empêcher le
  relevé des téléchargements. Vos données existantes sont conservées.
submitter: Jean-Michel EZES
submission: https://github.com/jihemezes/ezes-umbrel-store
